<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スキマ簿記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column like a 振替伝票 on a ledger pad; red/blue ruled lines, a vermilion 判子 for verdicts. */
:root {
  --paper: #eef3f0;
  --sheet: #fbfdfc;
  --ink: #1d2a2c;
  --muted: #5d6f70;
  --line: #cfdcd7;
  --red: #c4473b;      /* 帳簿の赤罫 */
  --blue: #2f6596;     /* 帳簿の青罫 */
  --shu: #d6392a;      /* 朱肉 */
  --ok: #237a52;
  --chip: #e3ece8;
  --c-asset: #2f6596; --c-liab: #b0532c; --c-eq: #6b4fa0; --c-rev: #237a52; --c-exp: #9a6a12;
  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121a1b; --sheet: #1a2425; --ink: #e5ece9; --muted: #93a6a5; --line: #2c3b3c;
    --red: #e0675b; --blue: #6fa3d6; --shu: #ef5a48; --ok: #4fbf8a; --chip: #243233;
    --c-asset: #6fa3d6; --c-liab: #e08a5f; --c-eq: #a88be0; --c-rev: #4fbf8a; --c-exp: #d6a640;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121a1b; --sheet: #1a2425; --ink: #e5ece9; --muted: #93a6a5; --line: #2c3b3c;
  --red: #e0675b; --blue: #6fa3d6; --shu: #ef5a48; --ok: #4fbf8a; --chip: #243233;
  --c-asset: #6fa3d6; --c-liab: #e08a5f; --c-eq: #a88be0; --c-rev: #4fbf8a; --c-exp: #d6a640;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 20px) calc(env(safe-area-inset-bottom, 0px) + 40px);
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

/* header */
header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--f-display); font-size: 2rem; line-height: 1.1; margin: 0; letter-spacing: .02em; }
.logo small { display: block; font-family: var(--f-body); font-size: .78rem; font-weight: 500; color: var(--muted); letter-spacing: .12em; margin-bottom: 4px; }
.back { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: .85rem; color: var(--muted); }

/* stats strip, like the 合計 row of a ledger */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 2px solid var(--blue); border-bottom: 3px double var(--red); background: var(--sheet); }
.stats div { padding: 10px 8px; text-align: center; }
.stats div + div { border-left: 1px solid var(--line); }
.stats b { display: block; font-family: var(--f-num); font-size: 1.5rem; line-height: 1.2; }
.stats span { font-size: .72rem; color: var(--muted); letter-spacing: .08em; }

/* mode list */
.modes { display: flex; flex-direction: column; gap: 10px; }
.mode { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 14px; text-align: left; background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; transition: transform .12s, border-color .12s; }
.mode:hover { border-color: var(--blue); transform: translateY(-1px); }
.mode .ic { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--shu); color: var(--shu); display: grid; place-items: center; font-family: var(--f-display); font-size: 1.25rem; }
.mode h3 { margin: 0; font-size: 1.05rem; }
.mode p { margin: 0; font-size: .8rem; color: var(--muted); line-height: 1.5; }
.mode .meta { font-size: .72rem; color: var(--muted); text-align: right; white-space: nowrap; }
.note { font-size: .78rem; color: var(--muted); line-height: 1.6; }

/* quiz shell */
.progress { display: flex; align-items: center; gap: 10px; font-size: .8rem; color: var(--muted); }
.bar { flex: 1; height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--blue); transition: width .3s; }
.combo { font-family: var(--f-num); color: var(--shu); font-weight: 700; min-width: 4.5em; text-align: right; }

.card { position: relative; background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 20px 18px; }
.card .tag { font-size: .72rem; letter-spacing: .12em; color: var(--red); font-weight: 700; }
.question { font-size: 1.06rem; font-weight: 500; margin: 6px 0 0; }

/* 伝票 */
.slip { width: 100%; font-size: .86rem; border-collapse: collapse; table-layout: fixed; }
.slip th { font-size: .7rem; font-weight: 700; letter-spacing: .1em; color: var(--blue); border-bottom: 1px solid var(--blue); padding: 2px 6px; text-align: left; }
.slip td { padding: 4px 5px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; line-height: 1.45; }
.slip td.amt { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: .74rem; white-space: nowrap; overflow-wrap: normal; padding-top: 6px; }
.slip td.mid, .slip th.mid { border-left: 3px double var(--red); }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; text-align: left; background: var(--sheet); border: 1.5px solid var(--line); border-radius: 4px; padding: 10px 12px; transition: border-color .12s, background .12s; }
.choice:hover:not(:disabled) { border-color: var(--blue); }
.choice .lab { font-family: var(--f-display); color: var(--muted); font-size: 1rem; padding-top: 2px; }
.choice:disabled { cursor: default; }
.choice.correct { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--sheet)); }
.choice.wrong { border-color: var(--shu); background: color-mix(in srgb, var(--shu) 8%, var(--sheet)); }
.choice > div { min-width: 0; }

/* ○× */
.ox { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ox button { font-family: var(--f-display); font-size: 3rem; line-height: 1; padding: 22px 0; border-radius: 6px; border: 2px solid var(--line); background: var(--sheet); }
.ox .o { color: var(--blue); }
.ox .x { color: var(--shu); }
.ox button:hover:not(:disabled) { border-color: currentColor; }
.ox button.picked { border-color: currentColor; background: color-mix(in srgb, currentColor 10%, var(--sheet)); }

/* 仕分け */
.timer { height: 10px; background: var(--chip); border-radius: 5px; overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--red); transition: width .2s linear; }
.word { text-align: center; padding: 34px 12px; }
.word .w { font-family: var(--f-display); font-size: clamp(1.4rem, 6.5vw, 2.1rem); line-height: 1.3; text-wrap: balance; }
.word .fb { min-height: 1.6em; font-size: .9rem; margin-top: 10px; color: var(--muted); }
.cats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.cats button { grid-column: span 2; padding: 16px 4px; border-radius: 6px; border: 2px solid currentColor; background: var(--sheet); font-weight: 700; font-size: 1rem; }
.cats button:nth-child(4) { grid-column: 2 / span 2; }
.cats button:active { background: color-mix(in srgb, currentColor 15%, var(--sheet)); }
.k-asset { color: var(--c-asset); } .k-liab { color: var(--c-liab); } .k-eq { color: var(--c-eq); } .k-rev { color: var(--c-rev); } .k-exp { color: var(--c-exp); }
.big { font-family: var(--f-num); font-size: 1.3rem; }

/* 計算 */
.calc-row { display: flex; gap: 8px; align-items: center; }
.calc-row input { flex: 1; min-width: 0; font-family: var(--f-num); font-size: 1.4rem; padding: 10px 12px; border: 2px solid var(--line); border-radius: 4px; background: var(--sheet); color: var(--ink); text-align: right; }
.calc-row span { font-size: 1rem; color: var(--muted); }
.primary { background: var(--blue); color: #fff; border: none; border-radius: 4px; padding: 12px 20px; font-weight: 700; font-size: 1rem; }
.ghost { background: none; border: 1.5px solid var(--line); border-radius: 4px; padding: 11px 18px; font-weight: 500; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

/* 解説 */
.explain { border-left: 3px solid var(--blue); padding: 8px 12px; background: var(--sheet); font-size: .9rem; display: flex; flex-direction: column; gap: 6px; }
.explain b.v-ok { color: var(--ok); } .explain b.v-ng { color: var(--shu); }

/* 判子 */
.stamp { position: absolute; top: -14px; right: 4px; width: 68px; height: 68px; border: 3px solid var(--shu); border-radius: 50%; color: var(--shu); display: grid; place-items: center; font-family: var(--f-display); font-size: 1.05rem; line-height: 1; transform: rotate(-14deg); opacity: .92; pointer-events: none; background: var(--sheet); }
.stamp::after { content: ""; position: absolute; inset: 4px; border: 1px solid var(--shu); border-radius: 50%; }
.stamp.ng { border-style: dashed; color: var(--muted); border-color: var(--muted); }
.stamp.ng::after { border-color: var(--muted); }
.stamp.hit { animation: hit .38s cubic-bezier(.2,1.6,.4,1); }
@keyframes hit { 0% { transform: rotate(-14deg) scale(2.2); opacity: 0; } 100% { transform: rotate(-14deg) scale(1); opacity: .9; } }

/* 結果 */
.result { text-align: center; padding: 30px 18px 24px; }
.result .stamp { position: relative; inset: auto; margin: 0 auto 14px; width: 128px; height: 128px; font-size: 1.9rem; }
.result h2 { font-family: var(--f-display); font-size: 2.4rem; margin: 0; line-height: 1.1; }
.result p { margin: 6px 0 0; color: var(--muted); }
.review { display: flex; flex-direction: column; gap: 10px; }
.review h3 { font-size: .85rem; letter-spacing: .1em; color: var(--red); margin: 0; }
.rv { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; font-size: .88rem; display: flex; flex-direction: column; gap: 6px; }

@media (prefers-reduced-motion: reduce) { .stamp.hit { animation: none; } .mode, .bar i, .timer i { transition: none; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ======================== 問題データ ======================== */
// 仕訳: "借方科目:金額+... | 貸方科目:金額+..."
const JOURNAL = [
  { q: "商品200,000円を仕入れ、代金のうち50,000円は小切手を振り出し、残額は掛けとした。（三分法）",
    a: "仕入:200000 | 当座預金:50000+買掛金:150000",
    w: ["仕入:200000 | 現金:50000+買掛金:150000", "仕入:200000 | 当座預金:50000+支払手形:150000", "繰越商品:200000 | 当座預金:50000+買掛金:150000"],
    e: "自分が振り出した小切手は「当座預金」の減少。掛け仕入は「買掛金」。三分法では仕入時に「仕入」（費用）を使う。" },
  { q: "得意先が倒産し、前期に発生した売掛金300,000円が貸倒れた。貸倒引当金の残高は200,000円である。",
    a: "貸倒引当金:200000+貸倒損失:100000 | 売掛金:300000",
    w: ["貸倒損失:300000 | 売掛金:300000", "貸倒引当金:300000 | 売掛金:300000", "貸倒引当金繰入:100000+貸倒引当金:200000 | 売掛金:300000"],
    e: "前期発生分は引当金をまず取り崩し、不足分は「貸倒損失」。当期発生分なら引当金は使わず全額貸倒損失。" },
  { q: "決算（3月31日）。当期10月1日に1年分の保険料24,000円を支払い、全額費用処理している。",
    a: "前払保険料:12000 | 保険料:12000",
    w: ["保険料:12000 | 前払保険料:12000", "前払保険料:6000 | 保険料:6000", "未払保険料:12000 | 保険料:12000"],
    e: "10月〜3月の6か月分が当期、4月〜9月の6か月分（24,000×6/12＝12,000）が翌期分なので「前払保険料」（資産）へ繰り延べる。" },
  { q: "期首に備品（取得原価500,000円、減価償却累計額300,000円、間接法）を150,000円で売却し、代金は月末に受け取ることとした。",
    a: "減価償却累計額:300000+未収入金:150000+固定資産売却損:50000 | 備品:500000",
    w: ["減価償却累計額:300000+売掛金:150000+固定資産売却損:50000 | 備品:500000", "未収入金:150000+固定資産売却損:50000 | 備品:200000", "減価償却累計額:300000+未収入金:150000 | 備品:450000"],
    e: "帳簿価額200,000円を150,000円で売ったので売却損50,000円。商品以外の売却代金の未収は「売掛金」ではなく「未収入金」。" },
  { q: "自己株式（帳簿価額80,000円）を100,000円で処分し、代金は当座預金に入金された。",
    a: "当座預金:100000 | 自己株式:80000+その他資本剰余金:20000",
    w: ["当座預金:100000 | 自己株式:100000", "当座預金:100000 | 自己株式:80000+自己株式処分益:20000", "当座預金:100000 | 自己株式:80000+繰越利益剰余金:20000"],
    e: "自己株式処分差益は損益ではなく「その他資本剰余金」で処理する（資本取引）。" },
  { q: "所有する受取手形200,000円を銀行で割り引き、割引料3,000円を差し引かれた残額を当座預金とした。",
    a: "当座預金:197000+手形売却損:3000 | 受取手形:200000",
    w: ["当座預金:197000+支払利息:3000 | 受取手形:200000", "当座預金:200000 | 受取手形:197000+手形売却損:3000", "当座預金:197000+手形売却損:3000 | 支払手形:200000"],
    e: "手形の割引は手形の売却とみなすので、割引料は「手形売却損」。" },
  { q: "商品100,000円をクレジット払いで販売した。信販会社への手数料（代金の4％）は販売時に計上する。",
    a: "クレジット売掛金:96000+支払手数料:4000 | 売上:100000",
    w: ["売掛金:100000 | 売上:100000", "クレジット売掛金:100000 | 売上:96000+支払手数料:4000", "クレジット売掛金:96000 | 売上:96000"],
    e: "手数料は「支払手数料」（費用）。信販会社に対する債権は手数料を引いた額で「クレジット売掛金」。" },
  { q: "決算において、現金過不足（借方残高）5,000円の原因が判明しなかった。",
    a: "雑損:5000 | 現金過不足:5000",
    w: ["現金過不足:5000 | 雑益:5000", "雑損:5000 | 現金:5000", "現金:5000 | 現金過不足:5000"],
    e: "借方残＝現金が足りなかった。不明分は「雑損」へ振り替える。" },
  { q: "社債（額面総額1,000,000円）を額面100円につき98円で発行し、払込金は当座預金とした。",
    a: "当座預金:980000 | 社債:980000",
    w: ["当座預金:980000+社債発行差金:20000 | 社債:1000000", "当座預金:1000000 | 社債:1000000", "当座預金:980000 | 社債:1000000+社債利息:20000"],
    e: "社債は払込金額（980,000円）で計上し、額面との差額は償却原価法で毎期加算していく。" },
  { q: "決算。売買目的有価証券（帳簿価額500,000円）の期末時価は520,000円であった。",
    a: "売買目的有価証券:20000 | 有価証券評価損益:20000",
    w: ["売買目的有価証券:20000 | その他有価証券評価差額金:20000", "有価証券評価損益:20000 | 売買目的有価証券:20000", "売買目的有価証券:520000 | 有価証券評価損益:520000"],
    e: "売買目的有価証券は時価評価し、評価差額は当期の損益（有価証券評価損益）とする。" },
  { q: "決算。その他有価証券（取得原価300,000円）の期末時価は280,000円。全部純資産直入法による。税効果は考慮しない。",
    a: "その他有価証券評価差額金:20000 | その他有価証券:20000",
    w: ["有価証券評価損益:20000 | その他有価証券:20000", "投資有価証券評価損:20000 | その他有価証券:20000", "その他有価証券:20000 | その他有価証券評価差額金:20000"],
    e: "全部純資産直入法では評価差額をすべて純資産の部（その他有価証券評価差額金）に計上する。翌期首には洗い替え。" },
  { q: "株主総会で、繰越利益剰余金を財源とする配当500,000円と、利益準備金50,000円の積立てが決議された。",
    a: "繰越利益剰余金:550000 | 未払配当金:500000+利益準備金:50000",
    w: ["繰越利益剰余金:500000 | 未払配当金:500000", "繰越利益剰余金:550000 | 当座預金:500000+利益準備金:50000", "利益準備金:50000+繰越利益剰余金:500000 | 未払配当金:550000"],
    e: "決議時点ではまだ支払っていないので「未払配当金」（負債）。準備金の積立額も繰越利益剰余金から減らす。" },
  { q: "決算。当期の法人税等800,000円が確定した。中間納付額300,000円は仮払法人税等で処理している。",
    a: "法人税等:800000 | 仮払法人税等:300000+未払法人税等:500000",
    w: ["法人税等:500000 | 未払法人税等:500000", "法人税等:800000 | 未払法人税等:800000", "仮払法人税等:300000+法人税等:500000 | 未払法人税等:800000"],
    e: "年税額を「法人税等」に計上し、中間納付分を相殺した残りが「未払法人税等」。" },
  { q: "建物の改修を行い、1,000,000円を小切手で支払った。うち600,000円は資本的支出である。",
    a: "建物:600000+修繕費:400000 | 当座預金:1000000",
    w: ["修繕費:1000000 | 当座預金:1000000", "建物:1000000 | 当座預金:1000000", "建物:400000+修繕費:600000 | 当座預金:1000000"],
    e: "価値を高める・耐用年数を延ばす部分は資本的支出として固定資産の取得原価に加算。原状回復部分は収益的支出（修繕費）。" },

const pick = a => a[Math.floor(Math.random() * a.length)];
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const fmt = n => Number(n).toLocaleString("ja-JP");
const monthsToEnd = p => p >= 4 ? 16 - p : 4 - p; // p月1日〜3月31日の月数

const CALC = [

    return { tag: "減価償却・定額法", q: `当期の${p}月1日に備品${fmt(C)}円を取得し、使用を開始した。残存価額ゼロ、耐用年数${n}年、定額法。決算日は3月31日。当期の減価償却費は？`,

    return { tag: "貸倒引当金", q: `期末の売掛金残高${fmt(B)}円に対して${r}%の貸倒引当金を差額補充法で設定する。貸倒引当金の残高は${fmt(R)}円。貸倒引当金繰入額は？`,

function record(ok) { store.total++; if (ok) store.correct++; const t = today(); store.days[t] = (store.days[t] || 0) + 1; save(); }
function streak() {
  let n = 0; const d = new Date();
  if (!store.days[today()]) d.setDate(d.getDate() - 1);
  for (;;) { const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    if (store.days[k]) { n++; d.setDate(d.getDate() - 1); } else break; }
  return n;
}

function parseSide(s) { return s.trim().split("+").map(p => { const [n, a] = p.split(":"); return { n: n.trim(), a: +a }; }); }
function slip(str) {
  const [l, r] = str.split("|"); const dr = parseSide(l), cr = parseSide(r); const n = Math.max(dr.length, cr.length);
  let rows = "";
  for (let i = 0; i < n; i++) {
    const d = dr[i], c = cr[i];
    rows += `<tr><td>${d ? d.n : ""}</td><td class="amt">${d ? fmt(d.a) : ""}</td><td class="mid">${c ? c.n : ""}</td><td class="amt">${c ? fmt(c.a) : ""}</td></tr>`;
  }
  return `<table class="slip"><colgroup><col style="width:28%"><col style="width:22%"><col style="width:28%"><col style="width:22%"></colgroup><thead><tr><th>借方</th><th></th><th class="mid">貸方</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function start(m) {
  if (m === "journal") S = { m, items: shuffle(JOURNAL.map((_, i) => i)).slice(0, 10) };
  if (m === "weak") S = { m: "journal", weak: true, items: shuffle(store.weakJ).slice(0, 10) };
  if (m === "ox") S = { m, items: shuffle(OX).slice(0, 10) };
  if (m === "calc") S = { m, items: shuffle(CALC).slice(0, 5).map(f => f()) };
  if (m === "sort") return startSort();
  Object.assign(S, { i: 0, score: 0, combo: 0, miss: [] });
  render();
}

function shell(inner, tag) {
  const n = S.items.length;
  return `<header class="top"><h1 class="logo" style="font-size:1.3rem">${tag}</h1><button class="back" id="quit">やめる</button></header>
    <div class="progress"><span class="num">${S.i + 1}/${n}</span><div class="bar"><i style="width:${S.i / n * 100}%"></i></div><span class="combo">${S.combo >= 2 ? S.combo + "連続" : ""}</span></div>
    ${inner}`;
}
function bindQuit() { document.getElementById("quit").onclick = home; }
function stampHTML(ok) { return `<div class="stamp hit ${ok ? "" : "ng"}">${ok ? "正解" : "誤り"}</div>`; }

function afterAnswer(ok, missInfo) {
  record(ok);
  if (ok) { S.score++; S.combo++; } else { S.combo = 0; S.miss.push(missInfo); }
}
function bindNext() { const b = document.getElementById("next"); b.focus(); b.onclick = () => { S.i++; S.i < S.items.length ? render() : result(); }; }

function render() {
  if (S.m === "journal") return renderJournal();
  if (S.m === "ox") return renderOX();
  if (S.m === "calc") return renderCalc();
}

function renderJournal() {
  const idx = S.items[S.i], it = JOURNAL[idx];
  const opts = shuffle([it.a, ...it.w]);
  app.innerHTML = shell(`
    <div class="card" id="qcard"><span class="tag">取引</span><p class="question">${it.q}</p></div>
    <div class="choices">${opts.map((o, k) => `<button class="choice" data-k="${k}"><span class="lab">${"ABCD"[k]}</span><div>${slip(o)}</div></button>`).join("")}</div>
    <div id="after"></div>`, S.weak ? "復習：仕訳" : "仕訳ドリル");
  bindQuit();
  app.querySelectorAll(".choice").forEach(b => b.onclick = () => {
    const ok = opts[+b.dataset.k] === it.a;
    app.querySelectorAll(".choice").forEach(x => { x.disabled = true; if (opts[+x.dataset.k] === it.a) x.classList.add("correct"); });
    if (!ok) b.classList.add("wrong");
    document.getElementById("qcard").insertAdjacentHTML("beforeend", stampHTML(ok));
    afterAnswer(ok, { q: it.q, a: slip(it.a), e: it.e });
    const w = new Set(store.weakJ);
    ok ? (S.weak && w.delete(idx)) : w.add(idx);
    store.weakJ = [...w]; save();
    document.getElementById("after").innerHTML = `<div class="explain"><b class="${ok ? "v-ok" : "v-ng"}">${ok ? "正解！" : "正解は緑の伝票"}</b><span>${it.e}</span></div>${nextBtn()}`;
    bindNext();
  });
}

function renderOX() {
  const [q, t, e] = S.items[S.i];
  app.innerHTML = shell(`
    <div class="card" id="qcard"><span class="tag">○か×か</span><p class="question">${q}</p></div>
    <div class="ox"><button class="o" data-v="1" aria-label="正しい">○</button><button class="x" data-v="0" aria-label="誤り">×</button></div>
    <div id="after"></div>`, "理論○×");
  bindQuit();
  app.querySelectorAll(".ox button").forEach(b => b.onclick = () => {
    const ok = (b.dataset.v === "1") === t;
    app.querySelectorAll(".ox button").forEach(x => x.disabled = true); b.classList.add("picked");
    document.getElementById("qcard").insertAdjacentHTML("beforeend", stampHTML(ok));
    afterAnswer(ok, { q, a: t ? "○" : "×", e });
    document.getElementById("after").innerHTML = `<div class="explain"><b class="${ok ? "v-ok" : "v-ng"}">答え：${t ? "○" : "×"}</b><span>${e}</span></div>${nextBtn()}`;
    bindNext();
  });
}

function renderCalc() {
  const it = S.items[S.i];
  app.innerHTML = shell(`
    <div class="card" id="qcard"><span class="tag">${it.tag}</span><p class="question">${it.q}</p></div>
    <form class="calc-row" id="f"><input id="calc-input" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="答え（円）"><span>円</span><button class="primary" type="submit">答える</button></form>
    <div class="actions"><button class="ghost" id="skip" type="button">わからない</button></div>
    <div id="after"></div>`, "電卓いらずの計算");
  bindQuit();
  const inp = document.getElementById("calc-input"); inp.focus();
  inp.oninput = () => { const v = inp.value.replace(/[^\d]/g, ""); inp.value = v ? fmt(+v) : ""; };
  const judge = val => {
    const ok = val === it.ans;
    inp.disabled = true; document.querySelector("#f button").disabled = true; document.getElementById("skip").remove();
    document.getElementById("qcard").insertAdjacentHTML("beforeend", stampHTML(ok));
    afterAnswer(ok, { q: it.q, a: fmt(it.ans) + "円", e: it.e });
    document.getElementById("after").innerHTML = `<div class="explain"><b class="${ok ? "v-ok" : "v-ng"}">答え：<span class="num">${fmt(it.ans)}</span>円</b><span>${it.e}</span></div>${nextBtn()}`;
    bindNext();
  };
  document.getElementById("f").onsubmit = ev => { ev.preventDefault(); const v = inp.value.replace(/[^\d]/g, ""); if (!v) return; judge(+v); };
  document.getElementById("skip").onclick = () => judge(NaN);
}

/* ふりわけ（60秒タイムアタック） */
function startSort() {
  const pool = shuffle(Object.entries(ACCOUNTS).flatMap(([k, list]) => list.map(n => [n, k])));
  S = { m: "sort", pool, i: 0, score: 0, combo: 0, miss: [], left: 60, end: Date.now() + 60000, lock: false };
  app.innerHTML = `<header class="top"><h1 class="logo" style="font-size:1.3rem">勘定科目ふりわけ</h1><button class="back" id="quit">やめる</button></header>
    <div class="progress"><span class="num big" id="score">0</span><span>問正解</span><div class="bar" style="opacity:0"></div><span class="combo" id="combo"></span><span class="num" id="sec">60</span></div>
    <div class="timer"><i id="tbar" style="width:100%"></i></div>
    <div class="card word"><div class="w" id="w"></div><div class="fb" id="fb">この勘定科目はどれ？</div></div>
    <div class="cats">${Object.entries(CAT).map(([k, v]) => `<button class="k-${k}" data-k="${k}">${v}</button>`).join("")}</div>`;
  bindQuit();
  const showWord = () => { document.getElementById("w").textContent = S.pool[S.i % S.pool.length][0]; };
  showWord();
  app.querySelectorAll(".cats button").forEach(b => b.onclick = () => {
    if (S.lock) return;
    const [name, k] = S.pool[S.i % S.pool.length], ok = b.dataset.k === k, fb = document.getElementById("fb");
    record(ok);
    if (ok) { S.score++; S.combo++; fb.innerHTML = `<span style="color:var(--ok)">○ ${CAT[k]}</span>`; }
    else { S.combo = 0; S.miss.push({ q: name, a: CAT[k], e: "" }); fb.innerHTML = `<span style="color:var(--shu)">× ${name} は <b>${CAT[k]}</b></span>`; }
    document.getElementById("score").textContent = S.score;
    document.getElementById("combo").textContent = S.combo >= 3 ? S.combo + "連続" : "";
    S.i++;
    if (!ok) { S.lock = true; setTimeout(() => { S.lock = false; if (S.m === "sort" && S.left > 0) showWord(); }, 650); } else showWord();
  });
  timerId = setInterval(() => {
    const ms = Math.max(0, S.end - Date.now()); S.left = Math.ceil(ms / 1000);
    const sec = document.getElementById("sec"), bar = document.getElementById("tbar");
    if (!sec) return clearInterval(timerId);
    sec.textContent = S.left; bar.style.width = (ms / 600) + "%";
    if (ms <= 0) { clearInterval(timerId); result(); }
  }, 200);
}

function result() {
  clearInterval(timerId);
  const isSort = S.m === "sort";
  const n = isSort ? S.score + S.miss.length : S.items.length;
  const key = S.weak ? null : S.m;
  const prev = key ? store.best[key] : undefined;
  const newBest = key && (prev === undefined || S.score > prev);
  if (newBest) { store.best[key] = S.score; save(); }
  const rate = n ? S.score / n : 0;
  let mark, title;
  if (isSort) { mark = S.score >= 30 ? "達人" : S.score >= 18 ? "合格" : "再挑戦"; title = `${S.score}問正解`; }
  else { mark = rate === 1 ? "満点" : rate >= 0.6 ? "合格" : "再挑戦"; title = `${S.score} / ${n}`; }
  const ok = mark !== "再挑戦";
  app.innerHTML = `
    <div class="card result">
      <div class="stamp hit ${ok ? "" : "ng"}">${mark}</div>
      <h2 class="num">${title}</h2>
      <p>${isSort ? `正答率 ${n ? Math.round(rate * 100) : 0}%（${n}問回答）` : ""}${newBest ? "　自己ベスト更新！" : ""}</p>
    </div>
    <div class="actions"><button class="ghost" id="home">メニューへ</button><button class="primary" id="again">もう一回</button></div>
    ${S.miss.length ? `<div class="review"><h3>間違えたところ</h3>${S.miss.map(m => `<div class="rv"><span>${m.q}</span>${m.a.startsWith("<table") ? m.a : `<b>→ ${m.a}</b>`}${m.e ? `<span class="note">${m.e}</span>` : ""}</div>`).join("")}</div>` : ""}`;
  const mode = S.weak ? "weak" : S.m;
  document.getElementById("home").onclick = home;
  document.getElementById("again").onclick = () => (mode === "weak" && !store.weakJ.length) ? home() : start(mode);
}

home();
</script>
</body>
</html>
